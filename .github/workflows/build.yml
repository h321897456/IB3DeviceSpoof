name: Build ElingFullscreen v20 dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: 下载最新版 fishhook
      run: |
        curl -L https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.c -o fishhook.c
        curl -L https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.h -o fishhook.h

    - name: 编译 dylib (恶灵全屏 v20 - FBO 诊断版)
      run: |
        clang -dynamiclib -arch arm64 \
          -DGLES_SILENCE_DEPRECATION \
          -DSPOOFED_CPU_COUNT=4 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -miphoneos-version-min=16.0 \
          -framework Foundation \
          -framework CoreGraphics \
          -framework UIKit \
          -framework QuartzCore \
          -framework OpenGLES \
          -fobjc-arc \
          -o ElingFullscreen.dylib \
          ElingFullscreen_v20.m fishhook.c

    - name: 验证编译结果
      run: |
        file ElingFullscreen.dylib
        ls -lh ElingFullscreen.dylib

    - name: 上传产物
      uses: actions/upload-artifact@v4
      with:
        name: ElingFullscreen.dylib
        path: ElingFullscreen.dylib
