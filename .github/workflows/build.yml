name: Build IB3DeviceSpoof v7 dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: 下载最新版 fishhook
      run: |
        curl -L https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.c -o fishhook.c
        curl -L https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.h -o fishhook.h

    - name: 编译 dylib (v7 全量诊断版)
      run: |
        clang -dynamiclib -arch arm64 \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -miphoneos-version-min=16.0 \
          -framework Foundation \
          -framework UIKit \
          -fobjc-arc \
          -o IB3DeviceSpoof.dylib \
          IB3DeviceSpoof_v7.m fishhook.c

    - name: 验证编译结果
      run: |
        file IB3DeviceSpoof.dylib
        ls -lh IB3DeviceSpoof.dylib

    - name: 上传产物
      uses: actions/upload-artifact@v4
      with:
        name: IB3DeviceSpoof.dylib
        path: IB3DeviceSpoof.dylib
