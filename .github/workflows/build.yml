name: Build IB3DeviceSpoof dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: 修复 libarclite 缺失
      run: |
        ARC_DIR="/Applications/Xcode_26.6.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/arc"
        sudo mkdir -p "$ARC_DIR"
        sudo curl -L -o "$ARC_DIR/libarclite_iphoneos.a" https://github.com/kamyarelyasi/Libarclite-Files/raw/master/libarclite_iphoneos.a

    - name: 下载最新版 fishhook
      run: |
        curl -L https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.c -o fishhook.c
        curl -L https://raw.githubusercontent.com/facebook/fishhook/main/fishhook.h -o fishhook.h

    - name: 编译 dylib
      run: |
        clang -arch arm64 -dynamiclib \
          -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
          -miphoneos-version-min=16.0 \
          -framework Foundation \
          -fobjc-arc \
          -o IB3DeviceSpoof.dylib \
          IB3DeviceSpoof.m fishhook.c

    - name: 验证编译结果
      run: |
        file IB3DeviceSpoof.dylib
        ls -lh IB3DeviceSpoof.dylib

    - name: 上传产物
      uses: actions/upload-artifact@v4
      with:
        name: IB3DeviceSpoof.dylib
        path: IB3DeviceSpoof.dylib
